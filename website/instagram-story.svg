<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#edf0e7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d7dfd0" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d7dfd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfc99e"/>
      <stop offset="1" stop-color="#bd9864"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#293c2e" flood-opacity=".17"/>
    </filter>
    <clipPath id="wallpaper-clip">
      <rect x="72" y="698" width="936" height="527" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#paper)"/>
  <circle cx="1005" cy="520" r="280" fill="url(#glow)"/>
  <circle cx="44" cy="1370" r="290" fill="url(#glow)" opacity=".65"/>
  <path d="M72 190H1008" stroke="#d8dfd3" stroke-width="2"/>

  <g transform="translate(72 82)" fill="none" stroke="#294936" stroke-width="4.2" stroke-linejoin="round">
    <path d="M32 54C19 53 10 42 9 27c11 0 20 6 23 16 3-10 12-16 23-16-1 15-10 26-23 27Z"/>
    <path d="M32 54C22 43 19 25 32 9c13 16 10 34 0 45Z"/>
  </g>
  <text x="143" y="123" fill="#294936" font-family="Georgia, 'Times New Roman', serif" font-size="38" letter-spacing="-1.4">verseglade</text>
  <text x="1008" y="117" text-anchor="end" fill="#738272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="3">A QUIETER DESKTOP</text>

  <text x="76" y="274" fill="#6d826e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="4">A DAILY MOMENT OF CLARITY</text>
  <path d="M76 299H126" stroke="#b99a68" stroke-width="3"/>
  <text x="72" y="400" fill="#203b2d" font-family="Georgia, 'Times New Roman', serif" font-size="81" letter-spacing="-2.7">A little wisdom,</text>
  <text x="72" y="492" fill="#6f866f" font-family="Georgia, 'Times New Roman', serif" font-size="81" font-style="italic" letter-spacing="-2.7">right where you work.</text>
  <text x="76" y="560" fill="#667367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">Add a Gita quote to the wallpaper you already love.</text>

  <g filter="url(#shadow)">
    <rect x="62" y="688" width="956" height="547" rx="34" fill="#fffefb"/>
  </g>
  <g clip-path="url(#wallpaper-clip)">
    <image href="assets/instagram-wallpaper-preview.jpg" x="72" y="698" width="936" height="527" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="72" y="698" width="936" height="527" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".68" stroke-width="2"/>

  <g transform="translate(76 1290)">
    <path d="M0 0H55" stroke="url(#gold)" stroke-width="3"/>
    <text x="0" y="39" fill="#987a4d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="3">BHAGAVAD GITA · 2.47</text>
    <text x="0" y="111" fill="#203b2d" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="-1.1">Give yourself to the work.</text>
    <text x="0" y="174" fill="#203b2d" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="-1.1">Release your grip on its reward.</text>
    <text x="2" y="218" fill="#798374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="2.2">AN ORIGINAL ENGLISH PARAPHRASE</text>
  </g>

  <path d="M76 1572H1004" stroke="#d8dfd3" stroke-width="2"/>
  <text x="76" y="1640" fill="#294936" font-family="Georgia, 'Times New Roman', serif" font-size="35">Make a little room for wisdom.</text>
  <text x="76" y="1682" fill="#758071" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="2">YOUR WALLPAPER. YOUR DAILY PAUSE.</text>

  <rect x="74" y="1730" width="932" height="106" rx="20" fill="#e5ebe1" stroke="#bdcbbb" stroke-width="2"/>
  <rect x="90" y="1746" width="900" height="74" rx="14" fill="none" stroke="#9eaf9a" stroke-width="2" stroke-dasharray="7 10"/>
  <text x="540" y="1793" text-anchor="middle" fill="#537055" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="3">ADD YOUR LINK STICKER HERE</text>
  <text x="540" y="1884" text-anchor="middle" fill="#899184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" letter-spacing="2">VERSEGLADE · A MOMENT OF CLARITY, BUILT INTO YOUR DAY</text>
</svg>
