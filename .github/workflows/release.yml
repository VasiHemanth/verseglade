name: Build desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            bundle: dmg
            asset: Verseglade-macOS-aarch64.dmg
            source: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: Windows
            os: windows-2022
            bundle: nsis
            asset: Verseglade-Windows-x64-setup.exe
            source: src-tauri/target/release/bundle/nsis/*.exe
          - platform: Linux
            os: ubuntu-22.04
            bundle: appimage
            asset: Verseglade-Linux-x64.AppImage
            source: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf wget

      - run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Prepare named release asset
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          files=( ${{ matrix.source }} )
          if [ "${#files[@]}" -ne 1 ]; then
            printf 'Expected one installer matching %s, found %s\n' '${{ matrix.source }}' "${#files[@]}" >&2
            exit 1
          fi
          cp "${files[0]}" "release-assets/${{ matrix.asset }}"

      - name: Sign Windows Installer (Trusted Signing)
        if: matrix.platform == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: release-assets
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Report Windows code signing status
        if: matrix.platform == 'Windows' && env.AZURE_CLIENT_ID == ''
        shell: bash
        run: |
          echo "::warning::Windows installer was packaged unsigned. Microsoft Store Policy 10.2.9 requires code signing chaining to Microsoft Trusted Root (e.g. via Microsoft Trusted Signing). Configure AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_TRUSTED_SIGNING_ACCOUNT_NAME, and AZURE_CERTIFICATE_PROFILE_NAME in GitHub repository secrets for automated signing."
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-store-installer:
    name: Publish direct Windows Store installer
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          name: installers-Windows
          path: windows-installer

      - name: Add versioned direct-download package
        run: |
          mkdir -p "website/downloads/${GITHUB_REF_NAME}"
          cp windows-installer/Verseglade-Windows-x64-setup.exe \
            "website/downloads/${GITHUB_REF_NAME}/Verseglade-Windows-x64-setup.exe"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
