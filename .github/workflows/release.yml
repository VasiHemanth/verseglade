name: Build desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            bundle: dmg
            asset: Verseglade-macOS-aarch64.dmg
            source: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: Windows
            os: windows-2022
            bundle: nsis
            asset: Verseglade-Windows-x64-setup.exe
            source: src-tauri/target/release/bundle/nsis/*.exe
          - platform: Linux
            os: ubuntu-22.04
            bundle: appimage
            asset: Verseglade-Linux-x64.AppImage
            source: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf wget

      - run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Prepare named release asset
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          files=( ${{ matrix.source }} )
          if [ "${#files[@]}" -ne 1 ]; then
            printf 'Expected one installer matching %s, found %s\n' '${{ matrix.source }}' "${#files[@]}" >&2
            exit 1
          fi
          cp "${files[0]}" "release-assets/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
